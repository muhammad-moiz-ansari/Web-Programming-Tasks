<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Div Archery Game</title>

<style>
  :root {
    --targetWidth: 45px;
    --targetHeight: 90px;
  }

  body {
    margin: 0;
    background: skyblue;
    font-family: Arial;
  }

  #score {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    background: white;
    padding: 5px 15px;
    border-radius: 20px;
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 90vh;
    overflow: hidden;
  }

  /* Bow */
  #bow {
    position: absolute;
    left: 20px;
    top: 50%;
    font-size: 50px;
    transform: translateY(-50%);
  }

  /* Arrow */
  #arrow {
    position: absolute;
    left: 80px;
    top: 50%;
    width: 70px;
    height: 8px;
    display: none;
  }

  /* Target */
  #target {
    position: absolute;
    right: 50px;
    top: 270px;
    width: 45px;
    height: 90px;
    border-radius: 50%;
    background: red;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>

<div id="gameArea">
  <div id="target"></div>
  <div id="bow">
    <img src="sprites/bow.png" alt="🏹" style="width: 100%; height: 100%; position: inherit;">
  </div>
  <div id="arrow">
    <img src="sprites/arrow.png" alt="arrow" style="width: 100%; height: 100%; position: inherit;">
  </div>
  
</div>

<script>
  const arrow = document.getElementById("arrow");
  const target = document.getElementById("target");
  const scoreDisplay = document.getElementById("score");

  let score = 0;
  let arrowMoving = false;
  let targetDirection = 1;
  let targetSpeed = 50;
  let targetMoveTime = 100 - targetSpeed;

  function runGame() {
    moveTargett();
  }
  
  function moveTarget() {
    /* Move target continuously */
    setInterval(() => {
      let top = target.offsetTop;
      let topMargin = 80;
      if (top <= 0 + topMargin || top >= window.innerHeight - (110 + topMargin)) {
        targetDirection *= -1;
      }
      target.style.top = top + (5 * targetDirection) + "px";
    }, targetMoveTime);
  }

  function updateScore() {
    score++;
    scoreDisplay.textContent = "Score: " + score;
  }

  /* Shoot arrow on click */
  document.addEventListener("click", () => {
    if (arrowMoving) return;
    const bow = document.getElementById("bow");

    arrowMoving = true;
    arrow.style.display = "block";
    arrow.style.left = "80px";
    arrow.style.top = (bow.offsetTop + 20) + "px";

    let arrowInterval = setInterval(() => {
      let arrowLeft = arrow.offsetLeft;
      arrow.style.left = arrowLeft + 15 + "px";
      let hitboxOffset = target.offsetWidth / 2;

      /* Collision detection */
      if (
        arrow.offsetLeft + arrow.offsetWidth >= target.offsetLeft + hitboxOffset &&
        arrow.offsetTop >= target.offsetTop &&
        arrow.offsetTop <= target.offsetTop + target.offsetHeight
      ) {
        updateScore();
        resetArrow();
        clearInterval(arrowInterval);
      }

      /* Arrow out of screen */
      if (arrowLeft > window.innerWidth) {
        resetArrow();
        clearInterval(arrowInterval);
      }
    }, 50);
  });

  function resetArrow() {
    arrowMoving = false;
    arrow.style.display = "none";
  }

  runGame();
</script>

</body>
</html>
