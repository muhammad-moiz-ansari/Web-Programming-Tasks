<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Div Archery Game</title>

<style>
  :root {
    --targetWidth: 45px;
    --targetHeight: 90px;
  }

  body {
    margin: 0;
    background: skyblue;
    font-family: Arial;
  }

  #score {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    background: white;
    padding: 5px 15px;
    border-radius: 20px;
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 90vh;
    overflow: hidden;
  }

  /* Bow */
  #bow {
    position: absolute;
    left: 50px;
    top: 50%;
    font-size: 80px;
    color: rgb(105, 71, 34);
    width: 40px;
    height: 130px;
    transform: translateY(-50%);
  }

  /* Arrow */
  #arrow {
    position: absolute;
    left: 80px;
    top: 50%;
    width: 85px;
    height: 9px;
    display: block;
  }

  /* Target */
  #target {
    position: absolute;
    right: 50px;
    top: 253px;
    width: 50px;
    height: 110px;
    border-radius: 50%;
    background: white;
  }
</style>
</head>

<body>

<div id="score">Score: 0</div>

<div id="gameArea">
  <div id="target">
    <img src="sprites/target.png" alt="" style="width: 100%; height: 100%; position: inherit;">
  </div>
  <div id="arrow">
    <img src="sprites/arrow.png" alt="=======" style="width: 100%; height: 100%; position: inherit;">
  </div>
  <div id="bow">
    <img src="sprites/bow.png" alt="}" style="width: 100%; height: 100%; position: inherit;">
  </div>
  
  
</div>

<script>
  const arrow = document.getElementById("arrow");
  const target = document.getElementById("target");
  const scoreDisplay = document.getElementById("score");

  let score = 0;
  let arrowMoving = false;
  let arrowPinned = false;
  let targetDirection = 1;
  let targetSpeed = 80;
  let targetMoveTime = 100 - targetSpeed;

  function runGame() {
    resetArrow();
    moveTarget();
  }
  
  function moveTarget() {
    /* Move target continuously */
    setInterval(() => {
      let top = target.offsetTop;
      let topMargin = 80;
      if (top <= 0 + topMargin || top >= window.innerHeight - (110 + topMargin)) {
        targetDirection *= -1;
      }
      target.style.top = top + (5 * targetDirection) + "px";
      if (arrowPinned) {
        arrow.style.top = arrow.offsetTop + (5 * targetDirection) + "px";
      }
    }, targetMoveTime);
  }

  function updateScore() {
    score++;
    scoreDisplay.textContent = "Score: " + score;
  }

  /* Shoot arrow on click */
  document.addEventListener("click", () => {
    if (arrowMoving) return;

    // Reloads arrow if already pinned to target
    if (arrowPinned) {
      resetArrow();
      arrowPinned = false;
      return;
    }
    
    const bow = document.getElementById("bow");
    arrowMoving = true;

    let arrowInterval = setInterval(() => {
      let arrowLeft = arrow.offsetLeft;
      arrow.style.left = arrowLeft + 15 + "px";
      let hitboxOffset = (target.offsetWidth / 2) - 7;  // Adjust hitbox for better accuracy

      /* Collision detection */
      if (
        arrow.offsetLeft + arrow.offsetWidth >= target.offsetLeft + hitboxOffset &&
        arrow.offsetTop >= target.offsetTop &&
        arrow.offsetTop <= target.offsetTop + target.offsetHeight
      ) {
        updateScore();
        //resetArrow();
        arrowMoving = false;
        arrowPinned = true;
        clearInterval(arrowInterval);
      }

      /* Arrow out of screen */
      if (arrowLeft > window.innerWidth) {
        resetArrow();
        clearInterval(arrowInterval);
      }
    }, 20);
  });

  function resetArrow() {
    arrowMoving = false;
    arrow.style.left = "39px";
    arrow.style.top = (bow.offsetTop + 0) + "px";
  }

  runGame();
</script>

</body>
</html>
