<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archery Game</title>
<link rel="icon" href="sprites/favicon.png" type="image/x-icon">

<style>
  :root {
    --bg-color: skyblue;
  }

  body {
    margin: 0;
    background: skyblue;
    font-family: Arial;
    user-select: none;
  }
  
  .navbar {
    display: flex;
    justify-content: space-between;
  }
  .target-scores {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 170px;
    height: 130px;
  }

  .arrowCount {
    position: absolute;
    top: 10px;
    right: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    width: 100px;
    height: 60px;
    
    font-size: 20px;
    background-color: antiquewhite;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 4px 4px 2.5px rgba(0, 0, 0, 0.299);
  }

  .displayBoard {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    position: absolute;
    width: 100%;
    z-index: 10;    
  }

  #timer {
    font-size: 24px;
    background: white;
    padding: 5px 15px;
    border-radius: 15px;
    box-shadow: 0 1px 4px 2.5px rgba(0, 0, 0, 0.299);
  }

  #score {
    font-size: 24px;
    background: white;
    padding: 5px 15px;
    border-radius: 20px;
    box-shadow: 0 1px 4px 2.5px rgba(0, 0, 0, 0.299);
  }

  #incScore {
    font-size: 24px;
    font-weight: 600;
    padding: 0px;
    margin: 10px;
    transition: all 0.5s ease-in-out;
    opacity: 0;
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  #bow {
    position: absolute;
    top: 55%;
    left: 25px;
    font-size: 104px;
    color: rgb(105, 71, 34);
    width: 73px;
    height: 130px;
    transform: translateY(-50%);  /* To bring bow's center equal to arrow's height */
  }

  #arrow {
    position: absolute;
    top: 55%;
    left: 39px;
    width: 91px;
    height: 9px;
    display: block;
  }

  #target {
    position: absolute;
    top: 48%;/*287px;*/
    right: 50px;
    width: 50px;
    height: 110px;
    border-radius: 50%;
    background-color: white;
  }

</style>
</head>
<body>
  <div class="navbar">
    <div class="target-scores">
      <img src="sprites/target_scores.png" alt="target scores" style="width: 100%; height: 100%; position: left;">
    </div>
    <div class="displayBoard">
      <div id="timer">Time: 60 s</div>
      <div id="score">Score: 0</div>
      <p id="incScore"></p>
    </div>
    <div class="arrowCount">
      <img id="bagImg" src="sprites/bag1.png" alt="" style="width: 100%; height: 100%; position: left;">
      <p id="arrowCount" style="width: 200px">10</p>
    </div>
  </div>

  <div id="gameArea">
    <div id="target">
      <img src="sprites/target.png" alt="" style="width: 100%; height: 100%; position: inherit;">
    </div>
    <div id="arrow">
      <img src="sprites/arrow.png" alt="=======" style="width: 100%; height: 100%; position: inherit;">
    </div>
    <div id="bow">
      <img id="bowImg" src="sprites/bow2.png" alt="}" style="width: 100%; height: 100%; position: inherit;">
    </div>
  </div>

<script>
  const arrow = document.getElementById("arrow");
  const target = document.getElementById("target");
  const bow = document.getElementById("bow");
  const scoreDisplay = document.getElementById("score");
  const timeDisplay = document.getElementById("timer");
  const arrowCountDisplay = document.getElementById("arrowCount");
  const bagImage = document.getElementById("bagImg");
  const scoreInc = document.getElementById("incScore");
  const bowImage = document.getElementById("bowImg");

  ///////////////////
  //               //
  /*   VARIABLES   */
  //               //
  ///////////////////

  // Screen Displays
  let timeLeft = 60;
  let score = 0;
  let arrowCount = 10;

  // Booleans
  let tempEndGame = true;
  let gameOver = false;
  let arrowMoving = false;
  let arrowPinned = false;

  let targetDirection = 1;

  // Speeds
  let targetSpeed = 80;
  let targetMoveTime = 100 - targetSpeed;
  let arrowSpeed = 20;
  
  // MAIN Function
  function runGame() {
    setTimeAndArrows();
    startTimer();
    resetArrow();
    moveTarget();
  }

  function setTimeAndArrows() {
    timeDisplay.textContent = "Time: " + timeLeft + " s";
    arrowCountDisplay.textContent = arrowCount;
  }

  function startTimer() {
    setInterval(() => {
      if (gameOver) return;
      if (timeLeft > 0)
        timeLeft -= 1;
      else {
        gameOver = true;
        endGame();
      }
      timeDisplay.textContent = "Time: " + timeLeft + " s";
    }, 1000);
  }

  function moveTarget() {
    setInterval(() => {
      if (gameOver) return;
      let extraMargin = 110;
      let topBorder = 0 + extraMargin;
      let bottomBorder = window.innerHeight - extraMargin + 75;
      let targetTop = target.offsetTop;
      let targetBottom = targetTop + target.offsetHeight;

      if(targetTop <= topBorder)
        targetDirection = 1;
      else if (targetBottom >= bottomBorder)
        targetDirection = -1;

      target.style.top = target.offsetTop + (5 * targetDirection) + "px";
      if (arrowPinned) {
        arrow.style.top = arrow.offsetTop + (5 * targetDirection) + "px";
      }
    }, targetMoveTime);
  }

  function updateScore(areaHit) {
    let scoreIncrement;
    if (areaHit == 1)
      scoreIncrement = 5;
    else if (areaHit == 2)
      scoreIncrement = 10;
    else if (areaHit == 3)
      scoreIncrement = 15;
    else if (areaHit == 4)
      scoreIncrement = 30;
    else if (areaHit == 5)
      scoreIncrement = 50;
    else
      scoreIncrement = 1;
    
    score += scoreIncrement;
    scoreDisplay.textContent = "Score: " + score;
    scoreInc.textContent = "+ " + scoreIncrement + "pts";
    scoreInc.style.opacity = 1;
  }

  function updateArrowCount() {
    if (arrowCount > 0) arrowCount--;
    arrowCountDisplay.textContent = arrowCount;

    if (arrowCount == 2)
      bagImage.src = "sprites/bag2.png";
    else if (arrowCount == 1)
      bagImage.src = "sprites/bag3.png";
    else if (arrowCount == 0)
      bagImage.src = "sprites/bag4.png";
  }

  function endGame() {
    if (!gameOver) return;
    resetArrow();
    target.style.top = bow.offsetTop - (target.offsetHeight / 2) + "px"; //"253px";
    arrowPinned = false;
    arrowMoving = false;
    alert("Game Over! Your final score is: " + score);
  }

  /* Shooting Arrow Click Handled */
  document.addEventListener("click", () => {
    if (gameOver || arrowCount <= 0) return;
    if (arrowMoving) return;

    // Reloads arrow if already pinned to target
    if (arrowPinned) {
      resetArrow();
      arrowPinned = false;
      scoreInc.style.opacity = 0;
      return;
    }
    
    arrowMoving = true;
    updateArrowCount();
    shoot();

    arrowInterval = setInterval(() => {
      let arrowTip = arrow.offsetLeft + arrow.offsetWidth;
      let targetTop = target.offsetTop;
      let targetBottom = targetTop + target.offsetHeight;
      let targetSurface = target.offsetLeft + (target.offsetWidth / 2) - 20;
      arrow.style.left = arrow.offsetLeft + 15 + "px";

      // Check Collision
      if (arrowTip >= targetSurface &&
          arrowTip <= targetSurface + 15 &&
          arrow.offsetTop >= targetTop &&
          arrow.offsetTop + arrow.offsetHeight <= targetBottom
      ) {
        let areaHit = checkInnerCollision(arrow.offsetTop + (arrow.offsetHeight / 2));
        updateScore(areaHit);
        arrowMoving = false;
        arrowPinned = true;
        clearInterval(arrowInterval);
      }

      // Arrow out of bounds
      if (arrow.offsetLeft > window.innerWidth) {
        resetArrow();
        clearInterval(arrowInterval);
      }
    }, arrowSpeed);
  });
  
  gameOverInterval = setInterval(() => {
    let isGameFinished = gameOver || arrowCount <= 0;

    if (isGameFinished && tempEndGame && arrowMoving == false) {
      // wait 2 seconds
      scoreInc.style.opacity = 0;
      gameOver = true;
      tempEndGame = false;
      endGame();
      clearInterval(gameOverInterval);
    }
  }, 50);

  function checkInnerCollision(arrowTip) {
    let targetTop = target.offsetTop
    let originalH = 634;
    let fact = originalH / target.offsetHeight;
    /*
    let w1 = targetTop;
    let wb1 = targetTop + 9.35;
    let bbl1 = targetTop + 19.74;
    let blr1 = targetTop + 31.35;
    let ry1 = targetTop + 43.13;
    let ry2 = targetTop + 66.52;
    let blr2 = targetTop + 78.13;
    let bbl2 = targetTop + 89.9;
    let wb2 = targetTop + 100.47;
    let w2 = targetTop + target.offsetHeight;
    */

    let w1 = targetTop;
    let wb1 = targetTop + (54 / fact);
    let bbl1 = targetTop + (115 / fact);
    let blr1 = targetTop + (182 / fact);
    let ry1 = targetTop + (249 / fact);
    let ry2 = targetTop + (385 / fact);
    let blr2 = targetTop + (451 / fact);
    let bbl2 = targetTop + (519 / fact);
    let wb2 = targetTop + (579 / fact);
    let w2 = targetTop + target.offsetHeight;

    let whiteHit = (arrowTip >= w1 && arrowTip <= wb1) || (arrowTip >= wb2 && arrowTip <= w2);
    let blackHit = (arrowTip >= wb1 && arrowTip <= bbl1) || (arrowTip >= bbl2 && arrowTip <= wb2);
    let blueHit = (arrowTip >= bbl1 && arrowTip <= blr1) || (arrowTip >= blr2 && arrowTip <= bbl2);
    let redHit = (arrowTip >= blr1 && arrowTip <= ry1) || (arrowTip >= ry2 && arrowTip <= blr2);
    let yellowHit = arrowTip >= ry1 && arrowTip <= ry2;

    if (whiteHit)
      return 1;
    else if (blackHit)
      return 2;
    else if (blueHit)
      return 3;
    else if (redHit)
      return 4;
    else if (yellowHit)
      return 5;
    else
      return 6;
  }

  function resetArrow() {
    arrowMoving = false;
    arrow.style.top = bow.offsetTop - (arrow.offsetHeight / 2) + "px";
    arrow.style.left = bow.offsetLeft + 40 + "px";
    reload();
  }

  /* ANIMATIONS */
  function reload() {
    let i = 1;
    let arrowOffset;

    reloadInt = setInterval(() => {
      if (i >= 6)
        clearInterval(reloadInt);
      bowImage.src = "sprites/bow" + i + ".png";
      if (i == 1)
        arrowOffset = 0;
      else if (i == 2)
        arrowOffset = 8;
      else if (i == 3)
        arrowOffset = 8;
      else if (i == 4)
        arrowOffset = 9;
      else if (i == 5)
        arrowOffset = 8;
      else if (i == 6)
        arrowOffset = 7;
      
      arrow.style.left = arrow.offsetLeft - arrowOffset + "px";
      i++;
    }, 25);
  }

  function shoot() {
    let i = 6;
    let arrowOffset;

    reloadInt = setInterval(() => {
      if (i <= 1)
        clearInterval(reloadInt);
      bowImage.src = "sprites/bow" + i + ".png";
      if (i == 1)
        arrowOffset = 0;
      else if (i == 2)
        arrowOffset = 8;
      else if (i == 3)
        arrowOffset = 8;
      else if (i == 4)
        arrowOffset = 9;
      else if (i == 5)
        arrowOffset = 8;
      else if (i == 6)
        arrowOffset = 7;
      
      arrow.style.left = arrow.offsetLeft - arrowOffset + "px";
      i--;
    }, 18);
  }

  runGame();
</script>
</body>
</html>
