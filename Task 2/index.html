<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Div Archery Game</title>

<style>
  :root {
    --targetWidth: 45px;
    --targetHeight: 90px;
  }

  body {
    margin: 0;
    background: skyblue;
    font-family: Arial;
  }

  .navbar {
    display: flex;
    justify-content: space-between;
  }

  .arrowCount {
    position: absolute;
    right: 15px;
    top: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    width: 80px;
    height: 60px;
    
    font-size: 20px;
    background-color: antiquewhite;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 4px 4px 2.5px rgba(0, 0, 0, 0.299);
  }

  .displayBoard {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    position: absolute;
    width: 100%;
    z-index: 10;    
  }

  #timer {
    font-size: 24px;
    background: white;
    padding: 5px 15px;
    border-radius: 15px;
    box-shadow: 0 1px 4px 2.5px rgba(0, 0, 0, 0.299);
  }

  #score {
    font-size: 24px;
    background: white;
    padding: 5px 15px;
    border-radius: 20px;
    box-shadow: 0 1px 4px 2.5px rgba(0, 0, 0, 0.299);
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 90vh;
    overflow: hidden;
  }

  /* Bow */
  #bow {
    position: absolute;
    left: 50px;
    top: 55%;
    font-size: 80px;
    color: rgb(105, 71, 34);
    width: 40px;
    height: 130px;
    transform: translateY(-50%);
  }

  /* Arrow */
  #arrow {
    position: absolute;
    left: 80px;
    top: 50%;
    width: 85px;
    height: 9px;
    display: block;
  }

  /* Target */
  #target {
    position: absolute;
    right: 50px;
    top: 253px;
    width: 50px;
    height: 110px;
    border-radius: 50%;
    background: white;
  }
</style>
</head>

<body>

  <div class="navbar">
    <div class="displayBoard">
      <div id="timer">Time: 60 s</div>
      <div id="score">Score: 0</div>
    </div>
    <div class="arrowCount">
      <img src="sprites/target.png" alt="" style="width: 100%; height: 100%; position: left;">
      <p style="width: 200px">10</p>
    </div>
  </div>

  <div id="gameArea">
    <div id="target">
      <img src="sprites/target.png" alt="" style="width: 100%; height: 100%; position: inherit;">
    </div>
    <div id="arrow">
      <img src="sprites/arrow.png" alt="=======" style="width: 100%; height: 100%; position: inherit;">
    </div>
    <div id="bow">
      <img src="sprites/bow.png" alt="}" style="width: 100%; height: 100%; position: inherit;">
    </div>
    
    
  </div>

<script>
  const arrow = document.getElementById("arrow");
  const target = document.getElementById("target");
  const bow = document.getElementById("bow");
  const scoreDisplay = document.getElementById("score");
  const timeDisplay = document.getElementById("timer");

  let gameOver = 0;
  let timeLeft = 60;
  let score = 0;
  let arrowMoving = false;
  let arrowPinned = false;
  let targetDirection = 1;
  let targetSpeed = 80;
  let targetMoveTime = 100 - targetSpeed;

  function runGame() {
    setTime();
    startTimer();
    resetArrow();
    moveTarget();
  }

  function setTime() {
    timeDisplay.textContent = "Time: " + timeLeft + " s";
  }

  function startTimer() {
    setInterval(() => {
      if (gameOver) return;
      if (timeLeft > 0)
        timeLeft -= 1;
      else {
        gameOver = 1;
        endGame();
      }
      timeDisplay.textContent = "Time: " + timeLeft + " s";
    }, 1000);
  }
  
  function moveTarget() {
    /* Move target continuously */
    setInterval(() => {
      if (gameOver) return;
      let top = target.offsetTop;
      let topMargin = 100;
      if (top <= 0 + topMargin || top >= window.innerHeight - (80 + topMargin)) {
        targetDirection *= -1;
      }
      target.style.top = top + (5 * targetDirection) + "px";
      if (arrowPinned) {
        arrow.style.top = arrow.offsetTop + (5 * targetDirection) + "px";
      }
    }, targetMoveTime);
  }

  function updateScore() {
    score++;
    scoreDisplay.textContent = "Score: " + score;
  }

  function endGame() {
    if (!gameOver) return;
    resetArrow();
    target.style.top = (window.innerHeight - target.offsetHeight) / 2 + "px"; //"253px";
    arrowPinned = false;
    arrowMoving = false;
    alert("Game Over! Your final score is: " + score);
  }

  /* Shoot arrow on click */
  document.addEventListener("click", () => {

    if (gameOver) return;
    if (arrowMoving) return;

    // Reloads arrow if already pinned to target
    if (arrowPinned) {
      resetArrow();
      arrowPinned = false;
      return;
    }
    
    arrowMoving = true;

    let arrowInterval = setInterval(() => {
      let arrowLeft = arrow.offsetLeft;
      arrow.style.left = arrowLeft + 15 + "px";
      let hitboxOffset = (target.offsetWidth / 2) - 7;  // Adjust hitbox for better accuracy

      /* Collision detection */
      let arrowTip = arrow.offsetLeft + arrow.offsetWidth;
      if (
        arrowTip >= target.offsetLeft + hitboxOffset &&
        arrowTip <= target.offsetLeft + hitboxOffset + 15 &&
        arrow.offsetTop >= target.offsetTop &&
        arrow.offsetTop + arrow.offsetHeight <= target.offsetTop + target.offsetHeight
      ) {
        updateScore();
        //resetArrow();
        arrowMoving = false;
        arrowPinned = true;
        clearInterval(arrowInterval);
      }

      /* Arrow out of screen */
      if (arrowLeft > window.innerWidth) {
        resetArrow();
        clearInterval(arrowInterval);
      }
    }, 20);
  });

  function resetArrow() {
    arrowMoving = false;
    arrow.style.left = "39px";
    arrow.style.top = (bow.offsetTop + 0) + "px";
  }

  runGame();
</script>

</body>
</html>
