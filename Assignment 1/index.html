<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>
    <div class="container">
        <!-- Image Holder -->
        <div class="image-container">
            <canvas id="canvas-image"></canvas>
        </div>

        <!-- Filters Section -->
        <div class="filters-container disabled-container">
            <h2>Photo Editor</h2>
            <!-- Filters Heading & Options -->
            <div class="filters-header">
                <h3 id="filters-heading">Filters</h3>
                <div class="header-btns">
                    <button id="history-btn">
                        <img src="images/history.png" alt="Undo" width="17px">
                    </button>
                    <button class="disabled-button" id="undo-btn" title="Undo" onclick="undo()">↶</button>
                    <button class="disabled-button" id="redo-btn" title="Redo" onclick="redo()">↷</button>
                </div>
            </div>
            <div class="history-container">
                <ul>
                    <!-- History List Items added dynamically -->
                </ul>
            </div>
            <div class="filter-options">
                <button class="btn options-btn-active">Brightness</button>
                <button class="btn options-btn-inactive">Saturation</button>
                <button class="btn options-btn-inactive">Inversion</button>
                <button class="btn options-btn-inactive">Grayscale</button>
                <button class="btn options-btn-inactive">Rotate</button>
                <button class="btn options-btn-inactive">Sepia</button>
                <button class="btn options-btn-inactive">Blur</button>
            </div>

            <!-- Filter Slider -->
            <div class="slider-info">
                <span id="slider-heading">Brightness</span>
                <span id="slider-percent">100%</span>
            </div>
            <input id="slider" type="range" step="3">

            <!-- Rotate & Flip -->
            <h3 id="rotate-flip-heading">Rotate & Flip</h3>
            <div class="rotate-flip">
                <button id="rotate-left" title="Rotate Left" onclick="rotate_left()">&#8634;</button>
                <button id="rotate-right" title="Rotate Right" onclick="rotate_right()">&#8635; </button>
                <button id="flip-x" title="Flip Horizontal" onclick="flip_horizontal()">&#8644; </button>                    
                <button id="flip-y" title="Flip Vertical" onclick="flip_vertical()">&#8645; </button>
            </div>
        </div>

        <!-- Left Buttons Outside -->
        <div class="left-buttons disabled-container">
            <button class="reset-btn btn" id="reset-btn" onclick="resetFilters()">Reset Filters</button>
        </div>

        <!-- Right Buttons Outside -->
        <div class="right-buttons">
            <input type="file" id="file-input" accept="image/*" hidden>
            <button class="choose-btn btn" id="choose-btn">📂 Choose Image</button>
            <button class="save-btn btn disabled-container" id="save-btn" onclick="saveImage()">💾 Save Image</button>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
