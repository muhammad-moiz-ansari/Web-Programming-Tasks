<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Image Holder -->
        <div class="image-container">
            <canvas id="canvas-image"></canvas>
        </div>

        <!-- Filters Section -->
        <div class="filters-container">
            <!-- Filters Heading & Options -->
            <h3>Filters</h3>
            <div class="filter-options">
                <button class="btn options-btn-active">Brightness</button>
                <button class="btn options-btn-inactive">Saturation</button>
                <button class="btn options-btn-inactive">Inversion</button>
                <button class="btn options-btn-inactive">Grayscale</button>
                <button class="btn options-btn-inactive">Rotate</button>
                <button class="btn options-btn-inactive">Sepia</button>
                <button class="btn options-btn-inactive">Blur</button>
            </div>

            <!-- Filter Slider -->
            <div class="slider-info">
                <span id="slider-heading">Brightness</span>
                <span id="slider-percent">100%</span>
            </div>
            <input id="slider" type="range">

            <!-- Rotate & Flip -->
            <h3>Rotate & Flip</h3>
            <div class="rotate-flip">
                <button id="rotate-left" title="Rotate Left">&#8634;</button>
                <button id="rotate-right" title="Rotate Right">&#8635; </button>
                <button id="flip-x" title="Flip Horizontal">&#8644; </button>                    
                <button id="flip-y" title="Flip Vertical">&#8645; </button>
            </div>
        </div>

        <!-- Left Buttons Outside -->
        <div class="left-buttons">
            <button class="reset-btn btn" id="reset-btn">Reset Filters</button>
        </div>

        <!-- Right Buttons Outside -->
        <div class="right-buttons">
            <input type="file" id="file-input" accept="image/*" hidden>
            <button class="choose-btn btn" id="choose-btn">📂 Choose Image</button>
            <button class="save-btn btn" id="save-btn">💾 Save Image</button>
        </div>
    </div>

<!--
    <script src="script.js"></script>
-->
<script>
// --- 1. GLOBAL VARIABLES ---
const fileInput = document.getElementById("file-input");
const chooseBtn = document.querySelector(".choose-btn");
const canvas = document.getElementById("canvas-image");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("slider");
const sliderHeading = document.getElementById("slider-heading");
const sliderValue = document.getElementById("slider-percent");
const filterButtons = document.querySelectorAll(".filter-options button");

// Filter State Variables (Default Values)
const currState= {
    brightness: 100,
    saturation: 100,
    inversion: 0,
    grayscale: 0,
    sepia: 0,
    blur: 0,
    angle: 0, // For rotation
    flipX: 1, // 1 for normal, -1 for flipped
    flipY: 1 // 1 for normal, -1 for flipped
};

// Track which filter is currently selected
let activeFilter = "Brightness"; 

// The Image Object
let originalImage = new Image(); 

// --- 2. INITIALIZATION ---
window.onload = function() {
    originalImage.onload = function() {
        canvas.width = originalImage.width;
        canvas.height = originalImage.height;
        ctx.drawImage(originalImage, 0, 0, originalImage.width, originalImage.height);
    };
    
    // Load Default Image
    originalImage.src = "default.png";

    slider.value = currState.brightness;
    sliderValue.textContent = slider.value + "%";
    sliderHeading.textContent = activeFilter;
    slider.max = "200";

    // Button Click -> Opens File Dialog
    chooseBtn.addEventListener("click", () => fileInput.click());

    // Loads New Image
    fileInput.addEventListener("change", function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage.src = event.target.result; 
            };
            reader.readAsDataURL(file);
        }
    });
};

// --- 3. FILTER APPLICATION FUNCTION ---
function applyFilters() {
    // Clear Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Save Context State
    ctx.save();

    // Move to Center for Rotation & Flipping
    ctx.translate(canvas.width / 2, canvas.height / 2);

    // Apply Rotation
    ctx.rotate((currState.angle * Math.PI) / 180);

    // Apply Flipping
    ctx.scale(currState.flipX, currState.flipY);

    // Move Back
    ctx.translate(-canvas.width / 2, -canvas.height / 2);

    // Set Filter Styles
    ctx.filter = `brightness(${currState.brightness}%)
        saturate(${currState.saturation}%)
        invert(${currState.inversion}%)
        grayscale(${currState.grayscale}%)
        sepia(${currState.sepia}%)
        blur(${currState.blur}px)`;

    // Draw Image with Filters
    ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

    // Restore Context State
    ctx.restore();
}

// --- 4. Update Filters ---
slider.addEventListener("input", function() {
    const value = this.value;
    sliderValue.textContent = `${value}%`;

    switch (activeFilter) {
        case "Brightness":
            currState.brightness = value;
            sliderHeading.textContent = "Brightness";
            break;
        case "Saturation":
            currState.saturation = value;
            sliderHeading.textContent = "Saturation";
            break;
        case "Inversion":
            currState.inversion = value;
            sliderHeading.textContent = "Inversion";
            break;
        case "Grayscale":
            currState.grayscale = value;
            sliderHeading.textContent = "Grayscale";
            break;
        case "Rotate":
            currState.angle = value;
            sliderHeading.textContent = "Rotate";
            sliderValue.textContent = `${value}°`;
            break;
        case "Sepia":
            currState.sepia = value;
            sliderHeading.textContent = "Sepia";
            break;
        case "Blur":
            currState.blur = value;
            sliderHeading.textContent = "Blur";
            sliderValue.textContent = `${value}px`;
            break;
    }
    applyFilters();
});

// --- 5. Filter Option Change ---
const inactiveBtns = document.querySelectorAll(".options-btn-inactive");

filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        let value;
        const activeBtn = document.querySelector(".options-btn-active");
        activeBtn.classList.remove("options-btn-active");
        activeBtn.classList.add("options-btn-inactive");
        const clickedName = btn.innerHTML;

        btn.classList.remove("options-btn-inactive");
        btn.classList.add("options-btn-active");

        activeFilter = clickedName;
        sliderHeading.textContent = clickedName;
        switch (activeFilter) {
            case "Brightness":
                value = currState.brightness;
                slider.max = "200";
                break;
            case "Saturation":
                value = currState.saturation;
                slider.max = "200";
                break;
            case "Inversion":
                value = currState.inversion;
                slider.max = "100";
                break;
            case "Grayscale":
                value = currState.grayscale;
                slider.max = "100";
                break;
            case "Rotate":
                value = currState.angle;
                sliderValue.textContent = `${value}°`;
                slider.min = "-360";
                slider.max = "360";
                break;
            case "Sepia":
                value = currState.sepia;
                slider.max = "100";
                break;
            case "Blur":
                value = currState.blur;
                sliderValue.textContent = `${value}px`;
                slider.max = "100";
                break;
            default:
                slider.min = "0";
                slider.max = "100";
        }
        if (activeFilter != "Blur" && activeFilter != "Rotate")
            sliderValue.textContent = `${value}%`;
        slider.value = value;
    })
})
</script>
</body>
</html>
