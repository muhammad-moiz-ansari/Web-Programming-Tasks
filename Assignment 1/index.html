<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Image Holder -->
        <div class="image-container">
            <canvas id="canvas-image"></canvas>
        </div>

        <!-- Filters Section -->
        <div class="filters-container">
            <!-- Filters Heading & Options -->
            <h3>Filters</h3>
            <div class="filter-options">
                <button class="btn options-btn-active">Brightness</button>
                <button class="btn options-btn-inactive">Saturation</button>
                <button class="btn options-btn-inactive">Inversion</button>
                <button class="btn options-btn-inactive">Grayscale</button>
                <button class="btn options-btn-inactive">Rotate</button>
                <button class="btn options-btn-inactive">Sepia</button>
                <button class="btn options-btn-inactive">Blur</button>
            </div>

            <!-- Filter Slider -->
            <div class="slider-info">
                <span id="slider-heading">Brightness</span>
                <span id="slider-percent">50%</span>
            </div>
            <input id="slider" type="range">

            <!-- Rotate & Flip -->
            <h3>Rotate & Flip</h3>
            <div class="rotate-flip">
                <button id="rotate-left" title="Rotate Left">&#8634;</button>
                <button id="rotate-right" title="Rotate Right">&#8635; </button>
                <button id="flip-x" title="Flip Horizontal">&#8644; </button>                    
                <button id="flip-y" title="Flip Vertical">&#8645; </button>
            </div>
        </div>

        <!-- Left Buttons Outside -->
        <div class="left-buttons">
            <button class="reset-btn btn" id="reset-btn">Reset Filters</button>
        </div>

        <!-- Right Buttons Outside -->
        <div class="right-buttons">
            <input type="file" id="file-input" accept="image/*" hidden>
            <button class="choose-btn btn" id="choose-btn">Choose Image</button>
            <button class="save-btn btn" id="save-btn">Save Image</button>
        </div>
    </div>

<!--
    <script src="script.js"></script>
-->
<script>
// --- 1. GLOBAL VARIABLES ---
const fileInput = document.getElementById("file-input");
const chooseBtn = document.querySelector(".choose-btn");
const canvas = document.getElementById("canvas-image");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("slider");
const sliderLabel = document.getElementById("slider-heading");
const sliderValue = document.getElementById("slider-percent");
const filterButtons = document.querySelectorAll(".filter-options button");

// Filter State Variables (Default Values)
let brightness = 100;
let saturation = 100;
let inversion = 0;
let grayscale = 0;
let angle = 0; // For rotation
let flipX = 1; // 1 for normal, -1 for flipped
let flipY = 1; // 1 for normal, -1 for flipped

// Track which filter is currently selected
let activeFilter = "Brightness"; 

// The Image Object
let originalImage = new Image(); 

// --- 2. INITIALIZATION ---
window.onload = function() {
    // Load Default Image
    originalImage.src = "default.png"; 
    
    originalImage.onload = function() {
        canvas.width = originalImage.width;
        canvas.height = originalImage.height;
        ctx.drawImage(originalImage, 0, 0, originalImage.width, originalImage.height);
    };

    // Button Click -> Opens File Dialog
    chooseBtn.addEventListener("click", () => fileInput.click());

    // Loads New Image
    fileInput.addEventListener("change", function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage.src = event.target.result; 
            };
            reader.readAsDataURL(file);
        }
    });
};

function applyFilters() {
    
}
</script>
</body>
</html>
